[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alt-celery3-contract"
version = "0.2.0"
description = "Strongly-typed, declarative task contracts extracted from the alt_celery3 Celery application (task names, argument signatures, Pydantic payload schemas)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "alt_celery3 contract maintainers" }]
keywords = [
    "celery",
    "contract",
    "schema",
    "pydantic",
    "task-queue",
    "distributed-systems",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Celery",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
# The contract package is purely declarative: it carries NO business logic and
# therefore only depends on Pydantic for payload validation.
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]
docs = [
    "sphinx>=8.0,<9",
    "sphinx-rtd-theme>=3.0,<4",
]

[project.urls]
Homepage = "https://github.com/gujiahui234/alt_celery3_contract"
Documentation = "https://alt-celery3-contract.readthedocs.io"
Source = "https://github.com/gujiahui234/alt_celery3_contract"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alt_celery3_contract = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
